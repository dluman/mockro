site_name: mockro
site_description: Mock MicroPython libraries for CPython development and testing
site_url: https://mockro.readthedocs.io/
repo_url: https://github.com/dluman/mockro
edit_uri: blob/main/docs/

nav:
  - Home: index.md
  - Quick start: quickstart.md
  - Usage:
      - Running scripts: usage/running.md
      - Testing with pytest: usage/testing.md
      - Patching and overriding: usage/patching.md
      - Recording calls: usage/recording.md
      - Module aliases: usage/aliases.md
  - Reference:
      - API: reference/api.md
      - Mocked modules: reference/modules.md
  - Examples:
      - LED blink: examples/led.md
      - Button press: examples/button.md
      - Wi-Fi connection: examples/wifi.md
      - I2C sensor: examples/sensor.md
      - CLI scaffold: examples/cli.md
  - CLI: cli.md
  - Changelog: changelog.md
  - Contributing: contributing.md

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_if_no_docstring: false

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - tables

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/dluman/mockro
