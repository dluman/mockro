[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "feign"
version = "0.1.0"
description = "Mock MicroPython libraries for CPython development and testing."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Douglas Luman", email = "douglas@example.com" },
]
keywords = ["micropython", "mock", "testing", "embedded", "hardware"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Embedded Systems",
]
dependencies = []

[project.optional-dependencies]
cli = []

[project.urls]
Homepage = "https://github.com/dougluman/feign"
Repository = "https://github.com/dougluman/feign"
Issues = "https://github.com/dougluman/feign/issues"

[project.scripts]
feign = "feign.cli:main"

[project.entry-points.pytest11]
feign = "feign.pytest_plugin"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/feign"]
force-include = { "src/feign/_feign.pth" = "feign.pth" }

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/template",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    "src/feign/stubs",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "D",
    "UP",
    "B",
    "C4",
    "SIM",
]
ignore = [
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D107",
    "D203",
    "D213",
    "N801",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"
disable_error_code = ["no-any-return"]
exclude = ["src/feign/stubs"]

[tool.uv]
default-groups = ["dev"]
